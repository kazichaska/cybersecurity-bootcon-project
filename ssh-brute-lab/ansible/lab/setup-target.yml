---
- name: Set up Ubuntu SSH Target
  hosts: localhost
  connection: local

  vars:
    docker_socket: "unix://{{ lookup('env', 'HOME') }}/.colima/default/docker.sock"

  tasks:
    - name: Start Ubuntu SSH target container
      community.docker.docker_container:
        name: target_ssh
        image: ubuntu
        state: started
        recreate: true
        command: /bin/bash
        tty: true
        interactive: true
        published_ports:
          - "2222:22"
        networks:
          - name: pentest-net
        docker_host: "{{ docker_socket }}"

    - name: Install and configure SSH in container
      community.docker.docker_container_exec:
        container: target_ssh
        command: |
          bash -c "apt update && apt install openssh-server -y &&
                    sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/g' /etc/ssh/sshd_config &&
                    sed -i 's/PermitRootLogin no/PermitRootLogin yes/g' /etc/ssh/sshd_config &&
                    service ssh restart &&
                    echo 'root:toor' | chpasswd"
        docker_host: "{{ docker_socket }}"
      environment:
        DOCKER_HOST: "{{ docker_socket }}"

    - name: Plant CTF flag for SSH track (always planted during lab setup)
      community.docker.docker_container_exec:
        container: target_ssh
        command: |
          bash -c "mkdir -p /root &&
                    echo 'CTF{brute_force_is_easy_when_passwords_are_weak}' > /root/flag.txt &&
                    chmod 600 /root/flag.txt"
        docker_host: "{{ docker_socket }}"
      environment:
        DOCKER_HOST: "{{ docker_socket }}"
