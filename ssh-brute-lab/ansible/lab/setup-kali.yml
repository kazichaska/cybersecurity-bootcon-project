---
- name: Set up Kali Attacker Container
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    docker_socket: "unix://{{ lookup('env', 'HOME') }}/.colima/default/docker.sock"

  tasks:
    - name: Create pentest network if it doesn't exist
      community.docker.docker_network:
        name: pentest-net
        state: present
        docker_host: "{{ docker_socket }}"

    - name: Pull Kali Linux image
      community.docker.docker_image:
        name: kalilinux/kali-rolling
        source: pull
        docker_host: "{{ docker_socket }}"

    - name: Start Kali container
      community.docker.docker_container:
        name: kali_attacker
        image: kalilinux/kali-rolling
        state: started
        recreate: true
        command: /bin/bash
        tty: true
        interactive: true
        networks:
          - name: pentest-net
        volumes:
          - "{{ playbook_dir }}/../scripts:/opt/lab"
        docker_host: "{{ docker_socket }}"

    - name: Install tools in Kali
      community.docker.docker_container_exec:
        container: kali_attacker
        command: |
          bash -c "set -euo pipefail && \
                  export DEBIAN_FRONTEND=noninteractive && \
                  printf '%s\n' 'deb http://mirror.us.cdn-perfprod.com/kali kali-rolling main contrib non-free non-free-firmware' >/etc/apt/sources.list && \
                  apt-get clean && rm -rf /var/lib/apt/lists/* && \
                  attempts=0 && \
                  until [ \"$attempts\" -ge 3 ]; do \
                    apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=true && \
                    apt-get install -y --no-install-recommends \
                      python3 \
                      python3-pip \
                      python3-requests \
                      hydra \
                      nmap \
                      wordlists \
                      iputils-ping \
                      netcat-traditional && break; \
                    attempts=$((attempts+1)); \
                    apt-get clean && rm -rf /var/lib/apt/lists/*; \
                  done && \
                  if ! dpkg -s python3 hydra nmap >/dev/null 2>&1; then \
                    apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=true && \
                    apt-get install -y --fix-missing --no-install-recommends \
                      python3 \
                      python3-pip \
                      python3-requests \
                      hydra \
                      nmap \
                      wordlists \
                      iputils-ping \
                      netcat-traditional; \
                  fi && \
                  if [ -f /usr/share/wordlists/rockyou.txt.gz ]; then gunzip -f /usr/share/wordlists/rockyou.txt.gz; fi && \
                  if [ -f /usr/share/wordlists/rockyou.txt ]; then \
                    grep -qxF 'toor' /usr/share/wordlists/rockyou.txt || sed -i '1i toor' /usr/share/wordlists/rockyou.txt; \
                    grep -qxF 'password123' /usr/share/wordlists/rockyou.txt || sed -i '1i password123' /usr/share/wordlists/rockyou.txt; \
                  fi"
        docker_host: "{{ docker_socket }}"
      environment:
        DOCKER_HOST: "{{ docker_socket }}"
      register: kali_install_output

    - name: Print Kali install output
      ansible.builtin.debug:
        var: kali_install_output.stdout_lines
